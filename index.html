<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprout Calculators</title>
<style>
  :root { --green:#17AD49; --dark:#15261e; --bg:#f2f7f4; --border:#cfe0d5; --muted:#6c7570; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:Arial, sans-serif; }
  .top-nav { position:sticky; top:0; z-index:9999; background:var(--dark); padding:12px 20px; display:flex; gap:10px; align-items:center; box-shadow:0 2px 12px rgba(0,0,0,.18); }
  .top-nav .brand { color:#fff; font-weight:800; margin-right:auto; font-size:14px; letter-spacing:.2px; }
  .nav-btn { border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; border-radius:999px; padding:10px 16px; font-weight:700; cursor:pointer; font-size:13px; }
  .nav-btn.active { background:var(--green); border-color:var(--green); }
  .frame-wrap { display:none; }
  .frame-wrap.active { display:block; }
  iframe { width:100%; border:0; display:block; min-height:calc(100vh - 58px); background:white; }
  @media (max-width:600px) { .top-nav { flex-wrap:wrap; } .top-nav .brand { width:100%; } }
</style>
</head>

    <div class="brand">Sprout Calculators</div>

    <button class="nav-btn" id="btn-reseller" onclick="showCalc('reseller')">Reseller Pricing Calculator</button>
    <button class="nav-btn" id="btn-roi" onclick="showCalc('roi')">ROI Calculator</button>
  </div>

  <div class="frame-wrap active" id="wrap-revshare">
    <iframe id="frame-revshare" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;Sprout Partner Revenue Calculator&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
  :root{
    --green:#17ad49;--sky:#02afce;--dark:#15261e;--lemon:#e0c651;
    --cherry:#c14a76;--grey:#6c7570;--bg:#f2f7f4;--surface:#ffffff;
    --surface2:#eaf3ed;--border:#cfe0d5;--text:#15261e;--muted:#6c7570;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:&quot;Plus Jakarta Sans&quot;,sans-serif;min-height:100vh;}
  body::before{content:&quot;&quot;;position:fixed;inset:0;background-image:radial-gradient(circle,rgba(23,173,73,0.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}

  /* ── HEADER ── */
  header{background:var(--dark);box-shadow:0 2px 16px rgba(21,38,30,0.2);position:relative;z-index:10;}
  .hdr{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .logo img{height:36px;width:auto;display:block;}
  .hdiv{width:1px;height:28px;background:rgba(255,255,255,0.14);}
  .brand-label{color:rgba(255,255,255,0.82);font-size:13px;font-weight:600;line-height:1.3;}
  .brand-label span{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,0.38);letter-spacing:0.04em;margin-top:1px;}
  .hstats{display:flex;gap:24px;flex-wrap:wrap;}
  .hstat{text-align:right;}
  .hstat-v{font-size:19px;font-weight:800;color:var(--lemon);line-height:1;}
  .hstat-l{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.35);margin-top:2px;}

  /* ── WRAP ── */
  .wrap{max-width:1280px;margin:0 auto;padding:32px 28px 64px;position:relative;z-index:1;}

  /* ── PAGE HEAD ── */
  .phead{margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--border);}
  .phead h1{font-size:clamp(20px,3vw,27px);font-weight:800;color:var(--dark);letter-spacing:-0.4px;}
  .phead h1 span{color:var(--green);}
  .phead p{font-size:13px;color:var(--muted);margin-top:5px;}

  /* ── SUMMARY PANEL (TOP) ── */
  .sumpanel{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:26px 28px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(21,38,30,0.08);}
  .sumpanel::before{content:&quot;&quot;;position:absolute;top:-70px;right:-70px;width:260px;height:260px;background:rgba(23,173,73,0.07);border-radius:50%;}
  .sumpanel::after{content:&quot;&quot;;position:absolute;bottom:-50px;left:-50px;width:180px;height:180px;background:rgba(2,175,206,0.05);border-radius:50%;}
  .sum-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;position:relative;z-index:1;}
  .sum-title{font-size:15px;font-weight:800;color:var(--dark);display:flex;align-items:center;gap:8px;}
  .sum-title::before{content:&quot;◆&quot;;color:var(--lemon);font-size:11px;}
  .sumcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px;position:relative;z-index:1;}
  .scard{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;}
  .scard-l{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .scard-v{font-size:16px;font-weight:800;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scard-v.big{font-size:18px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btbl{width:100%;border-collapse:collapse;font-size:12px;position:relative;z-index:1;}
  .btbl th{text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-size:9px;font-weight:700;padding:6px 10px;border-bottom:1.5px solid var(--border);}
  .btbl td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;}
  .btbl tr:last-child td{border-bottom:none;}
  .btbl tr:hover td{background:var(--surface2);}
  .btbl .trow td{border-top:2px solid var(--border);padding-top:10px;font-weight:800;font-size:13px;color:var(--dark);}
  .btbl-empty{color:var(--muted);text-align:center;padding:16px;font-size:12px;}

  /* ── CONTROLS ROW ── */
  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;}

  /* Reseller / Referral toggle */
  .type-toggle{display:flex;background:var(--surface);border:2px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(21,38,30,0.06);}
  .tbtn{padding:10px 18px;border:none;background:transparent;font-family:&quot;Plus Jakarta Sans&quot;,sans-serif;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .tbtn:first-child{border-right:2px solid var(--border);}
  .tbtn.active{background:var(--dark);color:#fff;}
  .pill{background:var(--border);color:var(--muted);border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700;transition:all 0.2s;}
  .tbtn.active .pill{background:var(--green);color:#fff;}

  /* Dropdown partner selector */
  .drop-wrap{position:relative;flex:1;min-width:220px;max-width:380px;}
  .drop-wrap select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:10px 38px 10px 14px;font-family:&quot;Plus Jakarta Sans&quot;,sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all 0.2s;box-shadow:0 2px 6px rgba(21,38,30,0.06);}
  .drop-wrap select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(23,173,73,0.1);}
  .drop-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px;}

  /* Add button */
  .add-btn{padding:10px 20px;background:var(--green);color:#fff;border:none;border-radius:10px;font-family:&quot;Plus Jakarta Sans&quot;,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;box-shadow:0 2px 8px rgba(23,173,73,0.25);}
  .add-btn:hover{background:#13973f;box-shadow:0 4px 12px rgba(23,173,73,0.35);}
  .add-btn:disabled{background:var(--border);color:var(--muted);box-shadow:none;cursor:not-allowed;}



  /* ── SECTION LABEL ── */
  .slabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .slabel::after{content:&quot;&quot;;flex:1;height:1px;background:var(--border);}

  /* ── CALC PANEL ── */
  .cpanel{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:22px;margin-bottom:28px;box-shadow:0 2px 8px rgba(21,38,30,0.05);}
  .citems{display:flex;flex-direction:column;gap:14px;}
  .citem{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:15px 18px;}
  .citem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .citem-name{font-size:14px;font-weight:800;color:var(--dark);}
  .citem-fml{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic;}
  .citem-rev{font-size:20px;font-weight:800;color:var(--green);white-space:nowrap;}
  .cfields{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;}
  .fgrp label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:4px;}
  .fgrp input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-family:&quot;Plus Jakarta Sans&quot;,sans-serif;font-size:13px;font-weight:600;transition:all 0.15s;-moz-appearance:textfield;}
  .fgrp input::placeholder{color:#b0bec5;font-weight:400;}
  .fgrp input::-webkit-outer-spin-button,.fgrp input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .fgrp input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(23,173,73,0.1);}
  .fhint{font-size:10px;color:var(--muted);margin-top:3px;}
  .rmbtn{background:none;border:1.5px solid rgba(193,74,118,0.3);color:var(--cherry);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:&quot;Plus Jakarta Sans&quot;,sans-serif;transition:all 0.2s;white-space:nowrap;}
  .rmbtn:hover{background:rgba(193,74,118,0.08);}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-ic{font-size:36px;margin-bottom:10px;opacity:0.2;}
  .empty-t{font-size:14px;font-weight:700;margin-bottom:4px;}
  .empty-s{font-size:12px;}

  /* ── BADGES ── */
  .bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
  .bdg-res{background:rgba(23,173,73,0.12);color:#0e8a38;}
  .bdg-ref{background:rgba(2,175,206,0.12);color:#0290aa;}
  .bdg-mu{background:rgba(224,198,81,0.2);color:#7a6500;}
  .bdg-com{background:rgba(193,74,118,0.12);color:var(--cherry);}

  @keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .citem{animation:fu 0.2s ease both;}

  /* ── HUBSPOT PREVIEW ── */
  .hslabel{font-size:.65rem;font-weight:700;letter-spacing:.08em;color:var(--green);text-transform:uppercase;margin-bottom:.4rem}
  .hspanel{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1.5rem;overflow-x:auto}
  .hspanel-empty{text-align:center;color:#94a3b8;font-size:.85rem;padding:1rem 0}
  .hs-table{width:100%;border-collapse:collapse;font-size:.75rem;min-width:900px}
  .hs-table thead tr{background:#f8fafc;border-bottom:2px solid #e2e8f0}
  .hs-table thead th{padding:.5rem .7rem;text-align:left;font-weight:700;color:#475569;white-space:nowrap;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
  .hs-table tbody tr{border-bottom:1px solid #f1f5f9;transition:background .15s}
  .hs-table tbody tr:hover{background:#f8fafc}
  .hs-table tbody td{padding:.55rem .7rem;color:#1e293b;vertical-align:middle}
  .hs-table tbody td.rev{font-weight:700;color:var(--green)}
  .hs-badge{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.68rem;font-weight:600}
  .hs-badge.reseller{background:#dcfce7;color:#166534}
  .hs-badge.referral{background:#dbeafe;color:#1e40af}
&lt;/style&gt;
&lt;/head&gt;

// ── STATE ──
let activeType = &quot;Reseller&quot;;
let selected   = new Set();   // set of partner ids currently in calc
let values     = {};          // pid -&gt; {fieldKey: value}


// ── FORMAT ──
function fmt(v){
  return &quot;₱&quot;+(v.toLocaleString(&quot;en-PH&quot;,{minimumFractionDigits:2,maximumFractionDigits:2}));
}
function fmtS(v){
  return v&gt;=1000?&quot;₱&quot;+(v/1000).toFixed(1)+&quot;K&quot;:&quot;₱&quot;+v.toFixed(0);
}
function calc(p,v){
  try{const r=p.formula(v||{});return(!isNaN(r)&amp;&amp;isFinite(r)&amp;&amp;r&gt;=0)?r:0;}catch{return 0;}
}

// ── TOGGLE TYPE ──
function setType(t,_btn){
  activeType = t;
  document.getElementById(&quot;btn-res&quot;).classList.toggle(&quot;active&quot;, t===&quot;Reseller&quot;);
  document.getElementById(&quot;btn-ref&quot;).classList.toggle(&quot;active&quot;, t===&quot;Referral&quot;);
  populateDropdown();
  // reset dropdown selection
  document.getElementById(&quot;partner-select&quot;).value = &quot;&quot;;
  document.getElementById(&quot;add-btn&quot;).disabled = true;
}

// ── DROPDOWN ──
function populateDropdown(){
  const sel = document.getElementById(&quot;partner-select&quot;);
  const available = PARTNERS.filter(p =&gt; p.type === activeType &amp;&amp; !selected.has(p.id));
  sel.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;— Select a partner —&lt;/option&gt;&#x27; +
    available.map(p =&gt; `&lt;option value=&quot;${p.id}&quot;&gt;${p.name} (${p.commissionRate})&lt;/option&gt;`).join(&quot;&quot;);
}

function onSelectChange(){
  const v = document.getElementById(&quot;partner-select&quot;).value;
  document.getElementById(&quot;add-btn&quot;).disabled = !v;
}

function addSelected(){
  const sel = document.getElementById(&quot;partner-select&quot;);
  const pid = sel.value;
  if(!pid) return;
  selected.add(pid);
  values[pid] = {};
  populateDropdown();
  sel.value = &quot;&quot;;
  document.getElementById(&quot;add-btn&quot;).disabled = true;
  renderCalc(); renderHS();
  updateSummary();
}

function removePartner(pid){
  selected.delete(pid);
  delete values[pid];
  populateDropdown(); // re-add to dropdown
  renderCalc(); renderHS();
  updateSummary();
}

// ── CALC RENDER ──
function renderHS(){
  const sel = PARTNERS.filter(p =&gt; selected.has(p.id));
  const empty = document.getElementById(&quot;hs-empty&quot;);
  const table = document.getElementById(&quot;hs-table&quot;);
  const tbody = document.getElementById(&quot;hs-tbody&quot;);
  if(!sel.length){
    empty.style.display=&quot;block&quot;; table.style.display=&quot;none&quot;; return;
  }
  empty.style.display=&quot;none&quot;; table.style.display=&quot;table&quot;;
  let rows = &quot;&quot;;
  let rowNum = 1;
  sel.forEach(partner =&gt; {
    // Merge stored values with placeholder defaults so preview shows data immediately
    const stored = values[partner.id] || {};
    const fieldList = partner.lineItems || partner.fields || [];
    const defaults = {};
    fieldList.forEach(f =&gt; {
      if(f.type !== &quot;select&quot; &amp;&amp; f.placeholder) defaults[f.key] = parseFloat(f.placeholder) || 0;
      else if(f.type === &quot;select&quot; &amp;&amp; f.options) defaults[f.key] = f.options[0];
    });
    const vals = Object.assign({}, defaults, stored);
    const up = +vals.unitPrice || 0;
    const qty = +vals.qty || 0;
    const mo = +vals.months || 1;
    const impl = +vals.impl || 0;
    const billingFreq = vals.billingFreq || &quot;Annually&quot;;
    const isOneTime = billingFreq === &quot;One Time Payment&quot;;
    const termMonths = +(vals.term || defaults.term || 12);
    // Billing frequency multiplier — how many months per billing cycle (for unit price display)
    const bfMonths = billingFreq === &quot;Annually&quot; ? 12
                   : billingFreq === &quot;Semi-Annual&quot; ? 6
                   : billingFreq === &quot;Quarterly&quot; ? 3
                   : billingFreq === &quot;Monthly&quot; ? 1
                   : 1; // One Time Payment
    // Unit price per billing cycle (e.g. Annual = UP × 12)
    const upPerCycle = up * bfMonths;
    // Subscription TCV = Unit Price × Qty × Term (full contract value)
    const subTCV = up * qty * termMonths;
    // Total TCV includes impl fee
    const tcv = subTCV + impl;
    // MRR = Unit Price × Qty (monthly recurring)
    const mrr = up * qty;
    // Revenue share stays as per partner formula
    const rev = partner.formula ? partner.formula(vals) : 0;
    const priceType = vals.priceType || partner.lineItems?.find(l=&gt;l.key===&quot;priceType&quot;)?.options?.[0] || &quot;Per User&quot;;
    const tier = vals.tier ? ` – ${vals.tier.split(&quot; &quot;)[0]}` : &quot;&quot;;
    const badge = partner.type === &quot;Reseller&quot;
      ? `&lt;span class=&quot;hs-badge reseller&quot;&gt;Reseller&lt;/span&gt;`
      : `&lt;span class=&quot;hs-badge referral&quot;&gt;Referral&lt;/span&gt;`;

    // Main line item
    rows += `&lt;tr&gt;
      &lt;td&gt;${rowNum++}&lt;/td&gt;
      &lt;td&gt;&lt;strong&gt;${partner.name}${tier}&lt;/strong&gt;&lt;/td&gt;
      &lt;td&gt;${badge}&lt;/td&gt;
      &lt;td&gt;${priceType}&lt;/td&gt;
      &lt;td&gt;${billingFreq}&lt;/td&gt;
      &lt;td&gt;${vals.term || defaults.term || 12} mo&lt;/td&gt;
      &lt;td&gt;${qty || &quot;—&quot;}&lt;/td&gt;
      &lt;td&gt;${upPerCycle ? &quot;₱&quot;+upPerCycle.toLocaleString() : &quot;—&quot;}&lt;/td&gt;
      &lt;td&gt;${subTCV ? &quot;₱&quot;+subTCV.toLocaleString() : &quot;—&quot;}&lt;/td&gt;
      &lt;td class=&quot;rev&quot;&gt;${rev ? &quot;₱&quot;+rev.toLocaleString(&quot;en-PH&quot;,{minimumFractionDigits:2,maximumFractionDigits:2}) : &quot;—&quot;}&lt;/td&gt;
    &lt;/tr&gt;`;

    // Implementation fee row if applicable
    if(impl &gt; 0){
      rows += `&lt;tr&gt;
        &lt;td&gt;${rowNum++}&lt;/td&gt;
        &lt;td&gt;&lt;em&gt;Implementation Fee – ${partner.name}&lt;/em&gt;&lt;/td&gt;
        &lt;td&gt;${badge}&lt;/td&gt;
        &lt;td&gt;Per Service&lt;/td&gt;
        &lt;td&gt;One Time&lt;/td&gt;
        &lt;td&gt;1&lt;/td&gt;
        &lt;td&gt;${qty || &quot;—&quot;}&lt;/td&gt;
        &lt;td&gt;₱${impl.toLocaleString()}&lt;/td&gt;
        &lt;td&gt;₱${impl.toLocaleString()}&lt;/td&gt;
        &lt;td class=&quot;rev&quot; style=&quot;color:#94a3b8;font-weight:500;&quot;&gt;Non-recurring&lt;/td&gt;
      &lt;/tr&gt;`;
    }
  });
  tbody.innerHTML = rows;
}

      &lt;label&gt;Billing Frequency&lt;/label&gt;
      &lt;select onchange=&quot;updVal(&#x27;${p.id}&#x27;,&#x27;billingFreq&#x27;,this.value)&quot; style=&quot;width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;font-family:&#x27;Plus Jakarta Sans&#x27;,sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;&quot;&gt;${bfOpts}&lt;/select&gt;
      &lt;div class=&quot;fhint&quot;&gt;How the client will be billed&lt;/div&gt;
    &lt;/div&gt;`;

      if(f.type===&quot;select&quot;){
        const opts = f.options.map(o=&gt;`&lt;option value=&quot;${o}&quot; ${(v[f.key]||f.options[0])===o?&quot;selected&quot;:&quot;&quot;}&gt;${o}&lt;/option&gt;`).join(&quot;&quot;);
        return `&lt;div class=&quot;fgrp&quot;&gt;
          &lt;label&gt;${f.label}&lt;/label&gt;
          &lt;select onchange=&quot;updVal(&#x27;${p.id}&#x27;,&#x27;${f.key}&#x27;,this.value)&quot; style=&quot;width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;font-family:&#x27;Plus Jakarta Sans&#x27;,sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;&quot;&gt;${opts}&lt;/select&gt;

        &lt;/div&gt;

      &lt;div class=&quot;cfields&quot;&gt;${fieldsHtml}&lt;/div&gt;

}

// ── UPDATE VALUE ──
function updVal(pid,key,val){
  if(!values[pid]) values[pid]={};
  const partner = PARTNERS.find(x=&gt;x.id===pid);
  const fieldList = partner ? (partner.lineItems||partner.fields||[]) : [];
  const field = fieldList.find(f=&gt;f.key===key);
  values[pid][key] = (field &amp;&amp; field.type===&quot;select&quot;) || key===&quot;billingFreq&quot; ? val : (parseFloat(val)||0);
  const p = PARTNERS.find(x=&gt;x.id===pid);
  if(p){
    const r = calc(p,values[pid]);
    const el = document.getElementById(&quot;rv-&quot;+pid);
    if(el) el.textContent = fmt(r);
    if(p.tcvFormula){
      const tcvEl = document.getElementById(&quot;tcv-&quot;+pid);
      if(tcvEl) tcvEl.innerHTML = `&lt;div style=&quot;font-size:11px;color:var(--muted);margin-top:6px;&quot;&gt;TCV: &lt;strong style=&quot;color:var(--dark)&quot;&gt;${fmt(p.tcvFormula(values[pid]))}&lt;/strong&gt;&lt;/div&gt;`;
    }
  }
  updateSummary();
  // If billing frequency changed, re-render the card so Term field updates
  if(key === &quot;billingFreq&quot;) renderCalc();
  renderHS();
}

// ── SUMMARY ──
function updateSummary(){
  const sel = PARTNERS.filter(p=&gt;selected.has(p.id));
  let tot=0, res=0, ref=0;
  sel.forEach(p=&gt;{const r=calc(p,values[p.id]||{});tot+=r;p.type===&quot;Reseller&quot;?res+=r:ref+=r;});
  document.getElementById(&quot;st&quot;).textContent = fmt(tot);
  document.getElementById(&quot;sr&quot;).textContent = fmt(res);
  document.getElementById(&quot;sf&quot;).textContent = fmt(ref);
  document.getElementById(&quot;sc&quot;).textContent = sel.length;
  document.getElementById(&quot;hv-sel&quot;).textContent = sel.length;
  document.getElementById(&quot;hv-rev&quot;).textContent = fmtS(tot);
  const tb = document.getElementById(&quot;btbody&quot;);
  if(!sel.length){ tb.innerHTML=&#x27;&lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;btbl-empty&quot;&gt;No partners selected yet&lt;/td&gt;&lt;/tr&gt;&#x27;; return; }
  tb.innerHTML = sel.map(p=&gt;{
    const r=calc(p,values[p.id]||{});
    const pct=tot&gt;0?((r/tot)*100).toFixed(1):&quot;0.0&quot;;
    const tb2=p.type===&quot;Reseller&quot;?&quot;bdg-res&quot;:&quot;bdg-ref&quot;;
    return `&lt;tr&gt;&lt;td&gt;&lt;strong&gt;${p.name}&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;bdg ${tb2}&quot; style=&quot;font-size:9px&quot;&gt;${p.type}&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;font-style:italic;color:var(--muted);font-size:11px&quot;&gt;${p.formulaText}&lt;/td&gt;&lt;td style=&quot;text-align:right;font-weight:700;color:#17ad49&quot;&gt;${fmt(r)} &lt;span style=&quot;color:var(--muted);font-size:10px&quot;&gt;(${pct}%)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;`;
  }).join(&quot;&quot;) + `&lt;tr class=&quot;trow&quot;&gt;&lt;td colspan=&quot;3&quot;&gt;Total Estimated Revenue Share&lt;/td&gt;&lt;td style=&quot;text-align:right;color:var(--green)&quot;&gt;${fmt(tot)}&lt;/td&gt;&lt;/tr&gt;`;
}

document.getElementById(&quot;pill-res&quot;).textContent = PARTNERS.filter(p=&gt;p.type===&quot;Reseller&quot;).length;
document.getElementById(&quot;pill-ref&quot;).textContent = PARTNERS.filter(p=&gt;p.type===&quot;Referral&quot;).length;

    .total-row.secondary .total-label { font-size: 12.5px; font-weight: 500; opacity: 0.72; }
    .total-row.secondary .total-value { font-size: 15px; font-weight: 700; opacity: 0.82; }

    /* Compare summary — two panels inside summary card */
    .summary-compare-wrap {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 620px) { .summary-compare-wrap { grid-template-columns: 1fr; } }

    .summary-panel {
      border-radius: 6px; padding: 16px;
    }
    .summary-panel.list-panel {
      background: #fff;
      border: 2px solid #fff;
      color: var(--text-dark);
    }
    .summary-panel.list-panel .summary-row { border-bottom-color: var(--border-light); }
    .summary-panel.list-panel .summary-row .label { color: var(--text-muted); opacity: 1; }
    .summary-panel.list-panel .summary-row .value { color: var(--text-dark); }
    .summary-panel.list-panel .summary-total { border-top-color: var(--border); }
    .summary-panel.list-panel .total-row .total-label { color: var(--text-dark); opacity: 1; }
    .summary-panel.list-panel .total-row .total-value { color: var(--green-deep); font-size: 22px; }
    .summary-panel.floor-panel {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.3);
    }
    .summary-panel-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .list-panel .summary-panel-label { color: var(--green); opacity: 1; }
    .floor-panel .summary-panel-label { opacity: 0.75; }
    .summary-panel-label .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; }
    .list-panel .summary-panel-label .dot { background: var(--green); }
    .summary-panel .summary-row { font-size: 12.5px; }
    .summary-panel .summary-total { margin-top: 12px; padding-top: 12px; }
    .summary-panel .total-row .total-value { font-size: 20px; }

    /* ── Tier Cards ── */
    .tier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .tier-grid { grid-template-columns: 1fr; } }
    .tier-card {
      border: 1.5px solid var(--border); border-radius: 6px;
      padding: 16px 18px; cursor: pointer; transition: all 0.18s;
      user-select: none; position: relative; background: var(--white);
    }
    .tier-card input[type=&quot;radio&quot;] { position: absolute; opacity: 0; width: 0; height: 0; }
    .tier-card:hover { border-color: var(--green); background: var(--green-light); }
    .tier-card.selected { border-color: var(--green); background: var(--green-light); }
    .tier-card .tier-name { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; padding-right: 28px; }
    .tier-card .tier-detail { font-size: 12px; color: var(--text-muted); font-weight: 500; line-height: 1.6; }
    .tier-card .tier-floor { font-size: 13px; font-weight: 700; color: var(--green); margin-top: 6px; }
    .tier-card .check-icon {
      position: absolute; top: 14px; right: 14px;
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: transparent; transition: all 0.18s;
    }
    .tier-card.selected .check-icon {
      background: var(--green); border-color: var(--green); color: #fff;
    }

    /* ── Price Range Bar ── */
    .price-range {
      background: var(--green-light); border: 1px solid rgba(23,173,73,0.25);
      border-radius: 6px; padding: 14px 18px; margin-top: 14px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    .price-range-item { text-align: center; }
    .price-range-item .pr-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 3px; }
    .price-range-item .pr-value { font-size: 20px; font-weight: 800; color: var(--text-dark); }
    .price-range-item .pr-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .price-range-item.floor .pr-value { color: var(--green); }
    .price-range-item.list .pr-value { color: var(--text-dark); }
    .price-range-arrow { font-size: 20px; color: var(--border); }

    /* tag list price */
    .tag-list { background: #fef9c3; color: #854d0e; }
    .tag-floor { background: var(--green-light); color: var(--green-deep); }

    /* ── Tier Feature List ── */
    .tier-features {
      list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 4px;
    }
    .tier-features li {
      font-size: 12px; color: var(--text-body); display: flex; align-items: flex-start; gap: 6px;
    }
    .tier-features li::before {
      content: &#x27;✓&#x27;; color: var(--green); font-weight: 700; font-size: 11px; margin-top: 1px; flex-shrink: 0;
    }
    .tier-features li.included-extra::before { content: &#x27;★&#x27;; color: var(--teal); }
    #dz-lms-features li, #dz-lxp-features li {
      display: block; padding-left: 16px; position: relative;
    }
    #dz-lms-features li::before, #dz-lxp-features li::before {
      position: absolute; left: 0; top: 0;
    }

    /* ── Included Add-on Card ── */
    .addon-card.included {
      border-color: var(--teal); background: var(--teal-light);
      cursor: default; opacity: 0.85;
    }
    .addon-card.included .check-icon {
      background: var(--teal); border-color: var(--teal); color: #fff;
    }
    .addon-card.included .addon-name { color: #0e6b7e; }
    .tag-included { background: var(--teal-light); color: #0e6b7e; }

    /* ── VIP Support box ── */
    .vip-support-box {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      border: 1px solid transparent;
    }
    .vip-included   { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .vip-available  { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .vip-unavailable{ background: #f9fafb; border-color: #e5e7eb; color: #6b7280; }
    .vip-note       { font-size: 0.8rem; opacity: 0.75; }

    /* ── Proposal Button &amp; Link ── */
    .proposal-btn {
      display: block; width: 100%; margin-top: 12px;
      padding: 13px; background: var(--green); color: #fff;
      border: none; border-radius: 8px; font-family: inherit;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.2s; text-align: center;
    }
    .proposal-btn:hover { background: var(--green-dark); }
    .proposal-link-wrap {
      margin-top: 10px; padding: 10px 14px;
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 8px; font-size: 0.875rem; text-align: center;
    }
    .proposal-link-wrap a { color: var(--green); font-weight: 600; text-decoration: none; }
    .proposal-link-wrap a:hover { text-decoration: underline; }

    /* ── Proposal Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 12px; padding: 32px 28px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
    .modal-subtitle { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-section { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
    .modal-field { margin-bottom: 12px; }
    .modal-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dark); margin-bottom: 4px; }
    .modal-field input {
      width: 100%; padding: 9px 12px; font-family: inherit; font-size: 14px;
      border: 1.5px solid var(--border); border-radius: 6px; outline: none;
      color: var(--text-dark); box-sizing: border-box; transition: border-color 0.2s;
    }
    .modal-field input:focus { border-color: var(--green); }
    .modal-field input[readonly] { background: #f9fafb; color: var(--text-muted); }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-submit {
      flex: 1; padding: 11px; background: var(--green); color: #fff;
      border: none; border-radius: 6px; font-family: inherit;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .modal-submit:hover { background: var(--green-dark); }
    .modal-cancel {
      padding: 11px 20px; background: #f3f4f6; color: var(--text-dark);
      border: none; border-radius: 6px; font-family: inherit;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .modal-generating { text-align: center; padding: 20px 0; color: var(--text-muted); font-size: 14px; }

    /* ── Hubstaff 5-col breakdown table ── */
    .hs-breakdown-table th:not(:first-child),
    .hs-breakdown-table td:not(:first-child) { text-align: right; }
    .hs-breakdown-table th:nth-child(2),
    .hs-breakdown-table td:nth-child(2) { color: var(--text-muted); }
    .hs-breakdown-table th:nth-child(4),
    .hs-breakdown-table td:nth-child(4) { color: var(--text-dark); font-weight: 600; }

    /* ── Disprz Year Buttons ── */
    .dz-year-btn {
      padding: 8px 20px; border-radius: 6px; border: 1.5px solid var(--border);
      background: var(--white); font-family: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; color: var(--text-muted);
      transition: all 0.18s;
    }
    .dz-year-btn:hover { border-color: var(--green); color: var(--green); }
    .dz-year-btn.active { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── Notice Bar ── */
    .notice-bar {
      display: flex; align-items: flex-start; gap: 10px;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 6px; padding: 12px 16px;
      margin-bottom: 16px; font-size: 13px; color: #78350f;
    }
    .notice-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
    .notice-items {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; line-height: 1.6;
    }
    .notice-item { color: #92400e; }
    .notice-item strong { color: #78350f; }
    .notice-sep { color: #d97706; font-weight: 700; }

  /* ── Auth Gate ── */
  #auth-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 60%, var(--green-deep) 100%);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .gate-card {
    background: #fff; border-radius: 12px; padding: 40px 36px;
    width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .gate-logo { margin-bottom: 12px; }
  .gate-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
  .gate-google-btn-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .gate-error {
    font-size: 12.5px; color: #dc2626; margin-top: 8px;
    display: none;
  }

  
#auth-gate,.gate-card,.gate-google-btn-wrap{display:none!important;}

  &lt;script&gt;
    const SESSION_KEY  = &#x27;sprout_calc_auth&#x27;;
    const SESSION_DAYS = 30;
    const CLIENT_ID    = &#x27;581646225833-d9baqi3tg8vdl7kudct1sj8ffq9nm890.apps.googleusercontent.com&#x27;;
    const PB_TEMPLATE  = &#x27;1yEvSBs7W4817gw67NmJ9QIFvVuSGNhZvgMnYJ_StfRU&#x27;;

    let sessionRepName  = &#x27;&#x27;;
    let tokenClient     = null;
    let accessToken     = null;
    let pbProposalData  = null; // populated by calcPeoplebox()

    function checkSession() {
      try {
        const stored = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (stored &amp;&amp; stored.expiry &gt; Date.now() &amp;&amp; stored.email.endsWith(&#x27;@sprout.ph&#x27;)) {
          sessionRepName = stored.name || &#x27;&#x27;;
          const gate = document.getElementById(&#x27;auth-gate&#x27;); if (gate) gate.style.display = &#x27;none&#x27;;
        }
      } catch (e) {}
    }

    function handleGoogleSignIn(response) {
      const payload = JSON.parse(atob(response.credential.split(&#x27;.&#x27;)[1]));
      const hd    = payload.hd    || &#x27;&#x27;;
      const email = payload.email || &#x27;&#x27;;
      const name  = payload.name  || &#x27;&#x27;;
      if (hd === &#x27;sprout.ph&#x27; || email.endsWith(&#x27;@sprout.ph&#x27;)) {
        sessionRepName = name;
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          email, name,
          expiry: Date.now() + SESSION_DAYS * 24 * 60 * 60 * 1000
        }));
        const gate = document.getElementById(&#x27;auth-gate&#x27;); if (gate) gate.style.display = &#x27;none&#x27;;
      } else {
        document.getElementById(&#x27;gate-error&#x27;).style.display = &#x27;block&#x27;;
        google.accounts.id.disableAutoSelect();
      }
    }

    function getTokenClient() {
      if (!tokenClient) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: &#x27;https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/documents&#x27;,
          callback: async (resp) =&gt; {
            if (resp.access_token) {
              accessToken = resp.access_token;
              await doGenerateProposal();
            }
          }
        });
      }
      return tokenClient;
    }

    function openProposalModal() {
      if (!pbProposalData) {
        alert(&#x27;Please enter the number of users first to calculate pricing.&#x27;);
        return;
      }
      document.getElementById(&#x27;pf-rep&#x27;).value = sessionRepName;
      document.getElementById(&#x27;proposal-modal&#x27;).classList.add(&#x27;open&#x27;);
    }

    function closeProposalModal() {
      document.getElementById(&#x27;proposal-modal&#x27;).classList.remove(&#x27;open&#x27;);
      document.getElementById(&#x27;modal-form-wrap&#x27;).style.display = &#x27;block&#x27;;
      document.getElementById(&#x27;modal-generating&#x27;).style.display = &#x27;none&#x27;;
    }

    function submitProposalForm() {
      const required = [&#x27;pf-company&#x27;,&#x27;pf-code&#x27;,&#x27;pf-address&#x27;,&#x27;pf-poc-first&#x27;,&#x27;pf-poc-last&#x27;,&#x27;pf-poc-designation&#x27;,&#x27;pf-golive&#x27;,&#x27;pf-valid&#x27;];
      for (const id of required) {
        if (!document.getElementById(id).value.trim()) {
          document.getElementById(id).focus();
          alert(&#x27;Please fill in all required fields.&#x27;);
          return;
        }
      }
      document.getElementById(&#x27;modal-form-wrap&#x27;).style.display = &#x27;none&#x27;;
      document.getElementById(&#x27;modal-generating&#x27;).style.display = &#x27;block&#x27;;
      if (accessToken) {
        doGenerateProposal();
      } else {
        getTokenClient().requestAccessToken();
      }
    }

    async function doGenerateProposal() {
      try {
        const d = pbProposalData;
        const company     = document.getElementById(&#x27;pf-company&#x27;).value.trim();
        const code        = document.getElementById(&#x27;pf-code&#x27;).value.trim();
        const address     = document.getElementById(&#x27;pf-address&#x27;).value.trim();
        const pocFirst    = document.getElementById(&#x27;pf-poc-first&#x27;).value.trim();
        const pocLast     = document.getElementById(&#x27;pf-poc-last&#x27;).value.trim();
        const pocFullName = `${pocFirst} ${pocLast}`;
        const pocDesig    = document.getElementById(&#x27;pf-poc-designation&#x27;).value.trim();
        const tl          = document.getElementById(&#x27;pf-tl&#x27;).value.trim();
        const golive      = document.getElementById(&#x27;pf-golive&#x27;).value;
        const validUntil  = document.getElementById(&#x27;pf-valid&#x27;).value;
        const today       = new Date().toLocaleDateString(&#x27;en-PH&#x27;, { year:&#x27;numeric&#x27;, month:&#x27;long&#x27;, day:&#x27;numeric&#x27; });
        const fmtDate     = (s) =&gt; s ? new Date(s).toLocaleDateString(&#x27;en-PH&#x27;, { year:&#x27;numeric&#x27;, month:&#x27;long&#x27;, day:&#x27;numeric&#x27; }) : &#x27;&#x27;;

        // Pricing values
        const subAnnual  = d.isBundle ? d.bundledSubAnnual  : d.stdSubAnnual;
        const implFee    = d.isBundle ? 0                   : d.implFee;
        const vatBase    = subAnnual + implFee;
        const vat        = vatBase * 0.12;
        const total      = vatBase + vat;
        const phpFmt     = (n) =&gt; &#x27;PHP &#x27; + n.toLocaleString(&#x27;en-PH&#x27;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // 1. Copy template
        const copyRes = await fetch(
          `https://www.googleapis.com/drive/v3/files/${PB_TEMPLATE}/copy`,
          {
            method: &#x27;POST&#x27;,
            headers: { &#x27;Authorization&#x27;: `Bearer ${accessToken}`, &#x27;Content-Type&#x27;: &#x27;application/json&#x27; },
            body: JSON.stringify({ name: `Proposal — ${company} — Peoplebox` })
          }
        );
        const copyJson = await copyRes.json();
        if (!copyRes.ok || !copyJson.id) {
          throw new Error(`Drive API error: ${JSON.stringify(copyJson.error || copyJson)}`);
        }
        const docId = copyJson.id;

        // 2. Replace placeholders
        const replacements = {
          &#x27;[Client.Company]&#x27;:    company,
          &#x27;[Client.Code]&#x27;:       code,
          &#x27;[Company.Address]&#x27;:   address,
          &#x27;[Name.ESC\&#x27;s]&#x27;:       sessionRepName,
          &#x27;[Name.TL\&#x27;s]&#x27;:        tl,
          &#x27;[Name of POC]&#x27;:       pocFullName,
          &#x27;[Client.FirstName]&#x27;:  pocFirst,
          &#x27;[Client.LastName]&#x27;:   pocLast,
          &#x27;[Client.Designation]&#x27;:pocDesig,
          &#x27;[Date.Effective]&#x27;:    today,
          &#x27;[Document.Revision]&#x27;: &#x27;1&#x27;,
          &#x27;[Date.Live]&#x27;:         fmtDate(golive),
          &#x27;MM-DD-YYYY&#x27;:          fmtDate(validUntil),
          &#x27;{{SUBTOTAL}}&#x27;:        phpFmt(subAnnual),
          &#x27;{{IMPL_FEE}}&#x27;:        phpFmt(implFee),
          &#x27;{{VAT}}&#x27;:             phpFmt(vat),
          &#x27;{{TOTAL}}&#x27;:           phpFmt(total),
          &#x27;{{NUM_LICENSES}}&#x27;:    String(d.users),
          &#x27;{{ANNUAL_FEE}}&#x27;:      phpFmt(subAnnual),
        };

        const requests = Object.entries(replacements).map(([find, replace]) =&gt; ({
          replaceAllText: {
            containsText: { text: find, matchCase: true },
            replaceText: replace
          }
        }));

        await fetch(
          `https://docs.googleapis.com/v1/documents/${docId}:batchUpdate`,
          {
            method: &#x27;POST&#x27;,
            headers: { &#x27;Authorization&#x27;: `Bearer ${accessToken}`, &#x27;Content-Type&#x27;: &#x27;application/json&#x27; },
            body: JSON.stringify({ requests })
          }
        );

        // 3. Open and show link
        const docUrl = `https://docs.google.com/document/d/${docId}/edit`;
        window.open(docUrl, &#x27;_blank&#x27;);
        document.getElementById(&#x27;pb-proposal-link&#x27;).href = docUrl;
        document.getElementById(&#x27;pb-proposal-link-wrap&#x27;).style.display = &#x27;block&#x27;;
        closeProposalModal();

      } catch (err) {
        console.error(err);
        alert(&#x27;Something went wrong generating the proposal. Please try again.&#x27;);
        closeProposalModal();
      }

    checkSession();

    const EXCHANGE_RATE = 60; // PHP per USD — applies across all products

            &lt;/div&gt;

        &lt;/div&gt;`;

    // ── TeamTailor ──
    const TT_TIERS = [

            &lt;div class=&quot;total-row secondary&quot;&gt;&lt;span class=&quot;total-label&quot;&gt;Total Annual Value&lt;/span&gt;&lt;span class=&quot;total-value&quot;&gt;${fmt(tier.annual)}&lt;/span&gt;&lt;/div&gt;

    // ── Hubstaff ──
    let hsTier = null;

    const HS_TIERS = {

      { key: &#x27;insights&#x27;,      name: &#x27;Insights&#x27;,          desc: &#x27;Activity detection, smart notifications, focus &amp; meeting time&#x27;,  listUSD: 2.50, floorUSD: 2.50 * 0.50 * 1.30, enterpriseIncluded: true  },

      // Reset add-on selections when switching tiers

    function renderHsAddons() {
      const card = document.getElementById(&#x27;hs-addons-card&#x27;);
      const grid = document.getElementById(&#x27;hs-addon-grid&#x27;);
      if (!hsTier) { card.style.display = &#x27;none&#x27;; return; }
      card.style.display = &#x27;block&#x27;;

      const isEnterprise = hsTier === &#x27;enterprise&#x27;;
      grid.innerHTML = HS_ADDONS_DEF.map(a =&gt; {

        const floorPHP = a.floorUSD * EXCHANGE_RATE;

            &lt;div class=&quot;addon-card included&quot;&gt;

            &lt;div class=&quot;addon-name&quot;&gt;${a.name}&lt;/div&gt;
            &lt;div class=&quot;addon-price&quot; style=&quot;margin-bottom:4px;&quot;&gt;${a.desc}&lt;/div&gt;
            &lt;div class=&quot;addon-price&quot;&gt;Floor: ${fmt(floorPHP)} &amp;nbsp;·&amp;nbsp; List: ${fmt(listPHP)}&lt;/div&gt;
            &lt;div class=&quot;check-icon&quot;&gt;✓&lt;/div&gt;
          &lt;/div&gt;`;
      }).join(&#x27;&#x27;);
    }

    function toggleHsAddon(key) {
      hsAddons[key] = !hsAddons[key];
      renderHsAddons();
      calcHubstaff();
    }

    function calcHubstaff() {
      const users       = parseInt(document.getElementById(&#x27;hs-users&#x27;).value) || 0;
      const breakdownEl = document.getElementById(&#x27;hs-breakdown&#x27;);

      if (!users || users &lt; 1 || !hsTier) {
        breakdownEl.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;Select a plan and enter the number of users to see the breakdown.&lt;/div&gt;&#x27;;
        return;
      }

      const t = HS_TIERS[hsTier];
      const isEnterprise = hsTier === &#x27;enterprise&#x27;;
      const listPUPM  = t.listUSD  * EXCHANGE_RATE;
      const floorPUPM = t.floorUSD * EXCHANGE_RATE;

      const listMonthly  = listPUPM  * users;
      const floorMonthly = floorPUPM * users;
      const listAnnual   = listMonthly  * 12;
      const floorAnnual  = floorMonthly * 12;

      // Build add-on rows
      let addonRows = &#x27;&#x27;;
      let totalAddonListMonthly  = 0;
      let totalAddonFloorMonthly = 0;

      HS_ADDONS_DEF.forEach(a =&gt; {
        const included = isEnterprise &amp;&amp; a.enterpriseIncluded;
        const active   = included || hsAddons[a.key];
        if (!active) return;

        const floorPHP = included ? 0 : a.floorUSD * EXCHANGE_RATE;
        const listPHP  = included ? 0 : a.listUSD  * EXCHANGE_RATE;
        const floorMo  = floorPHP * users;
        const listMo   = listPHP  * users;
        const incTag   = included ? `&lt;span class=&quot;tag tag-included&quot;&gt;Included&lt;/span&gt;` : `&lt;span class=&quot;tag tag-addon&quot;&gt;Add-on&lt;/span&gt;`;

        addonRows += `
          &lt;tr&gt;
            &lt;td class=&quot;item-name&quot;&gt;${a.name} ${incTag}&lt;/td&gt;
            &lt;td&gt;${included ? &#x27;—&#x27; : fmt(listPHP) + &#x27;/user&#x27;}&lt;/td&gt;
            &lt;td&gt;${included ? &#x27;—&#x27; : fmt(floorPHP) + &#x27;/user&#x27;}&lt;/td&gt;
            &lt;td&gt;${included ? &#x27;Included&#x27; : fmt(listMo * 12) + &#x27;/yr&#x27;}&lt;/td&gt;
            &lt;td&gt;${included ? &#x27;Included&#x27; : fmt(floorMo * 12) + &#x27;/yr&#x27;}&lt;/td&gt;
          &lt;/tr&gt;`;

        totalAddonListMonthly  += listMo;
        totalAddonFloorMonthly += floorMo;
      });

      const grandListAnnual  = listAnnual  + totalAddonListMonthly  * 12;
      const grandFloorAnnual = floorAnnual + totalAddonFloorMonthly * 12;

      // VIP Support (flat monthly fee based on MRR)
      const totalFloorMonthly = floorMonthly + totalAddonFloorMonthly;
      let vipFee = 0;
      let vipStatus = &#x27;&#x27;; // &#x27;included&#x27;, &#x27;available&#x27;, &#x27;unavailable&#x27;, &#x27;&#x27;
      if (isEnterprise) {
        vipStatus = &#x27;included&#x27;;
      } else {
        if (totalFloorMonthly &lt; 16500) {
          vipStatus = &#x27;unavailable&#x27;;
        } else if (totalFloorMonthly &lt;= 24000) {
          vipFee = 1740;
          vipStatus = &#x27;available&#x27;;
        } else {
          vipFee = 3540;
          vipStatus = &#x27;available&#x27;;
        }
      }

      const vipAnnual = vipStatus === &#x27;available&#x27; ? vipFee * 12 : 0;
      const grandListAnnualWithVip  = grandListAnnual  + vipAnnual;
      const grandFloorAnnualWithVip = grandFloorAnnual + vipAnnual;

      let vipRow = &#x27;&#x27;;
      if (vipStatus === &#x27;included&#x27;) {
        vipRow = `&lt;tr&gt;
          &lt;td class=&quot;item-name&quot;&gt;VIP Support &lt;span class=&quot;tag tag-included&quot;&gt;Included&lt;/span&gt;&lt;/td&gt;
          &lt;td&gt;Included&lt;/td&gt;&lt;td&gt;Included&lt;/td&gt;&lt;td&gt;Included&lt;/td&gt;&lt;td&gt;Included&lt;/td&gt;
        &lt;/tr&gt;`;
      } else if (vipStatus === &#x27;available&#x27;) {
        vipRow = `&lt;tr&gt;
          &lt;td class=&quot;item-name&quot;&gt;VIP Support &lt;span class=&quot;tag tag-addon&quot;&gt;Add-on&lt;/span&gt;&lt;/td&gt;
          &lt;td&gt;${fmt(vipFee)}/mo flat&lt;/td&gt;
          &lt;td&gt;${fmt(vipFee)}/mo flat&lt;/td&gt;
          &lt;td&gt;${fmt(vipAnnual)}/yr&lt;/td&gt;
          &lt;td&gt;${fmt(vipAnnual)}/yr&lt;/td&gt;
        &lt;/tr&gt;`;
      }

      breakdownEl.innerHTML = `
        &lt;table class=&quot;breakdown-table hs-breakdown-table&quot;&gt;
          &lt;thead&gt;
            &lt;tr&gt;
              &lt;th&gt;Item&lt;/th&gt;
              &lt;th&gt;List Rate&lt;/th&gt;
              &lt;th&gt;Floor Rate&lt;/th&gt;
              &lt;th&gt;List Annual&lt;/th&gt;
              &lt;th&gt;Floor Annual&lt;/th&gt;
            &lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;
              &lt;td class=&quot;item-name&quot;&gt;${t.name} License&lt;/td&gt;
              &lt;td&gt;${fmt(listPUPM)}/user/mo&lt;/td&gt;
              &lt;td&gt;${fmt(floorPUPM)}/user/mo&lt;/td&gt;
              &lt;td&gt;${fmt(listAnnual)}/yr&lt;/td&gt;
              &lt;td&gt;${fmt(floorAnnual)}/yr&lt;/td&gt;
            &lt;/tr&gt;
            ${addonRows}
            ${vipRow}
            &lt;tr style=&quot;border-top: 2px solid var(--border-light); font-weight:700;&quot;&gt;
              &lt;td class=&quot;item-name&quot;&gt;Total&lt;/td&gt;
              &lt;td&gt;—&lt;/td&gt;
              &lt;td&gt;—&lt;/td&gt;
              &lt;td&gt;${fmt(grandListAnnualWithVip)}&lt;/td&gt;
              &lt;td&gt;${fmt(grandFloorAnnualWithVip)}&lt;/td&gt;
            &lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;`;

      // ── Summary ──
      const summaryEl      = document.getElementById(&#x27;hs-summary&#x27;);
      const summaryContent = document.getElementById(&#x27;hs-summary-content&#x27;);

      let addonSummaryList  = &#x27;&#x27;;
      let addonSummaryFloor = &#x27;&#x27;;
      HS_ADDONS_DEF.forEach(a =&gt; {
        const included = isEnterprise &amp;&amp; a.enterpriseIncluded;
        const active   = included || hsAddons[a.key];
        if (!active) return;
        const listMo  = included ? 0 : a.listUSD  * EXCHANGE_RATE * users;
        const floorMo = included ? 0 : a.floorUSD * EXCHANGE_RATE * users;
        addonSummaryList  += `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;${a.name}&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${included ? &#x27;Included&#x27; : fmt(listMo * 12) + &#x27; / yr&#x27;}&lt;/span&gt;&lt;/div&gt;`;
        addonSummaryFloor += `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;${a.name}&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${included ? &#x27;Included&#x27; : fmt(floorMo * 12) + &#x27; / yr&#x27;}&lt;/span&gt;&lt;/div&gt;`;
      });

      summaryContent.innerHTML = `
        &lt;div class=&quot;summary-compare-wrap&quot;&gt;
          &lt;div class=&quot;summary-panel list-panel&quot;&gt;
            &lt;div class=&quot;summary-panel-label&quot;&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt; List Price&lt;/div&gt;
            &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;${t.name} License&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(listAnnual)} / yr&lt;/span&gt;&lt;/div&gt;
            ${addonSummaryList}
            ${vipStatus === &#x27;available&#x27; ? `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;VIP Support&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(vipFee)} / mo · ${fmt(vipAnnual)} / yr&lt;/span&gt;&lt;/div&gt;` : vipStatus === &#x27;included&#x27; ? `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;VIP Support&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;Included&lt;/span&gt;&lt;/div&gt;` : &#x27;&#x27;}
            &lt;div class=&quot;summary-total&quot;&gt;
              &lt;div class=&quot;total-row&quot;&gt;&lt;span class=&quot;total-label&quot;&gt;Total&lt;/span&gt;&lt;span class=&quot;total-value&quot;&gt;${fmt(grandListAnnualWithVip)}&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;summary-panel floor-panel&quot;&gt;
            &lt;div class=&quot;summary-panel-label&quot;&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt; Floor Price&lt;/div&gt;
            &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;${t.name} License&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(floorAnnual)} / yr&lt;/span&gt;&lt;/div&gt;
            ${addonSummaryFloor}
            ${vipStatus === &#x27;available&#x27; ? `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;VIP Support&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(vipFee)} / mo · ${fmt(vipAnnual)} / yr&lt;/span&gt;&lt;/div&gt;` : vipStatus === &#x27;included&#x27; ? `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;VIP Support&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;Included&lt;/span&gt;&lt;/div&gt;` : &#x27;&#x27;}
            &lt;div class=&quot;summary-total&quot;&gt;
              &lt;div class=&quot;total-row&quot;&gt;&lt;span class=&quot;total-label&quot;&gt;Total&lt;/span&gt;&lt;span class=&quot;total-value&quot;&gt;${fmt(grandFloorAnnualWithVip)}&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;

      summaryEl.style.display = &#x27;block&#x27;;
    }

    const addons = { talent: false, compensation: false, ai: false };
    let isMigration = false;
    let isBundle    = false;

    function switchTab(tab) {
      document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
      document.querySelectorAll(&#x27;.calculator-wrapper&#x27;).forEach(w =&gt; w.classList.remove(&#x27;active&#x27;));
      document.querySelector(`[onclick=&quot;switchTab(&#x27;${tab}&#x27;)&quot;]`).classList.add(&#x27;active&#x27;);
      document.getElementById(`tab-${tab}`).classList.add(&#x27;active&#x27;);
    }

    function toggleMigration() {
      isMigration = document.getElementById(&#x27;cb-migration&#x27;).checked;
      document.getElementById(&#x27;toggle-migration&#x27;).classList.toggle(&#x27;active&#x27;, isMigration);
      calcPeoplebox();
    }

    function toggleBundle() {
      isBundle = document.getElementById(&#x27;cb-bundle&#x27;).checked;
      document.getElementById(&#x27;toggle-bundle&#x27;).classList.toggle(&#x27;active&#x27;, isBundle);
      calcPeoplebox();
    }

    function toggleAddon(name) {
      addons[name] = !addons[name];
      document.getElementById(`addon-${name}`).classList.toggle(&#x27;selected&#x27;, addons[name]);
      document.getElementById(`cb-${name}`).checked = addons[name];
      calcPeoplebox();
    }

    function fmt(n) {
      return &#x27;₱&#x27; + n.toLocaleString(&#x27;en-PH&#x27;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function buildBreakdownTable(rows, note, noteClass) {
      return `
        &lt;table class=&quot;breakdown-table&quot;&gt;
          &lt;thead&gt;
            &lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Monthly&lt;/th&gt;&lt;th&gt;Annual&lt;/th&gt;&lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;${rows}&lt;/tbody&gt;
        &lt;/table&gt;
        &lt;div class=&quot;impl-note ${noteClass}&quot;&gt;${note}&lt;/div&gt;`;
    }

    function calcPeoplebox() {
      const users       = parseInt(document.getElementById(&#x27;pb-users&#x27;).value) || 0;
      const breakdownEl = document.getElementById(&#x27;pb-breakdown&#x27;);
      const summaryEl   = document.getElementById(&#x27;pb-summary&#x27;);
      const summaryContent = document.getElementById(&#x27;pb-summary-content&#x27;);

      if (!users || users &lt; 1) {
        breakdownEl.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;Enter the number of users above to see the full cost breakdown.&lt;/div&gt;&#x27;;
        summaryEl.style.display = &#x27;none&#x27;;
        return;
      }

      // ── Core pricing ──
      const perfBaseUSD  = 2;
      const PROC         = 1.02; // 2% processing fee silently baked in
      const perfPUPM     = 155; // floor price per user per month
      const talentPUPM   = 90  * PROC; // ₱91.80
      const compPUPM     = 100 * PROC; // ₱102.00
      const aiPUPM       = 20  * PROC; // ₱20.40

      const implFee = isMigration
        ? (users &lt;= 300 ? 30000 : 90000)
        : (users &lt;= 300 ? 95000 : 150000);

      const tier = users &lt;= 300 ? &#x27;1–300 headcount&#x27; : &#x27;301+ headcount&#x27;;

      // ── Add-on monthly/annual ──
      const talentMonthly = addons.talent       ? talentPUPM * users : 0;
      const compMonthly   = addons.compensation ? compPUPM   * users : 0;
      const aiMonthly     = addons.ai           ? aiPUPM     * users : 0;
      const addonsMonthly = talentMonthly + compMonthly + aiMonthly;
      const addonsAnnual  = addonsMonthly * 12;

      // ── Standard pricing ──
      const stdPerfMonthly = perfPUPM * users;
      const stdPerfAnnual  = stdPerfMonthly * 12;
      const stdSubAnnual   = stdPerfAnnual + addonsAnnual;
      const stdGrandTotal  = stdSubAnnual + implFee;

      // ── Bundled pricing ──
      // 2% processing applied to license base only (not impl fee)
      // impl fee ÷ headcount ÷ 12 months = monthly impl per user (PHP), no processing fee
      const implPerUserPerMonth = implFee / users / 12;
      const bundledBasePHP  = (perfPUPM / 1.25) + implPerUserPerMonth;
      const bundledPUPM     = bundledBasePHP * 1.25;
      const bundledPerfMonthly = bundledPUPM * users;
      const bundledPerfAnnual  = bundledPerfMonthly * 12;
      const bundledSubAnnual   = bundledPerfAnnual + addonsAnnual;
      const bundledGrandTotal  = bundledSubAnnual; // no separate impl fee

      // ── Helper: add-on rows ──
      function addonRows() {
        let r = &#x27;&#x27;;
        if (addons.talent)       r += `&lt;tr&gt;&lt;td class=&quot;item-name&quot;&gt;Talent Module &lt;span class=&quot;tag tag-addon&quot;&gt;Add-on&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${fmt(talentPUPM)} × ${users.toLocaleString()} users&lt;/td&gt;&lt;td&gt;${fmt(talentMonthly)}/mo&lt;/td&gt;&lt;td&gt;${fmt(talentMonthly * 12)}/yr&lt;/td&gt;&lt;/tr&gt;`;
        if (addons.compensation) r += `&lt;tr&gt;&lt;td class=&quot;item-name&quot;&gt;Compensation &lt;span class=&quot;tag tag-addon&quot;&gt;Add-on&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${fmt(compPUPM)} × ${users.toLocaleString()} users&lt;/td&gt;&lt;td&gt;${fmt(compMonthly)}/mo&lt;/td&gt;&lt;td&gt;${fmt(compMonthly * 12)}/yr&lt;/td&gt;&lt;/tr&gt;`;
        if (addons.ai)           r += `&lt;tr&gt;&lt;td class=&quot;item-name&quot;&gt;AI Add-on &lt;span class=&quot;tag tag-addon&quot;&gt;Add-on&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${fmt(aiPUPM)} × ${users.toLocaleString()} users&lt;/td&gt;&lt;td&gt;${fmt(aiMonthly)}/mo&lt;/td&gt;&lt;td&gt;${fmt(aiMonthly * 12)}/yr&lt;/td&gt;&lt;/tr&gt;`;
        return r;
      }

      // ── Helper: add-on summary rows ──
      function addonSummaryRows() {
        let r = &#x27;&#x27;;
        if (addons.talent)       r += `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Talent Module&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(talentMonthly * 12)} / yr&lt;/span&gt;&lt;/div&gt;`;
        if (addons.compensation) r += `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Compensation&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(compMonthly * 12)} / yr&lt;/span&gt;&lt;/div&gt;`;
        if (addons.ai)           r += `&lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;AI Add-on&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(aiMonthly * 12)} / yr&lt;/span&gt;&lt;/div&gt;`;
        return r;
      }

      const migTag    = isMigration ? &#x27;&lt;span class=&quot;tag tag-migration&quot;&gt;P+ Migration&lt;/span&gt;&#x27; : &#x27;&#x27;;
      const implLabel = isMigration ? &#x27;P+ Migration discount applied&#x27; : &#x27;Implementation fee bracket&#x27;;
      const implBracket = isMigration
        ? (users &lt;= 300 ? &#x27;1–300 headcount → ₱30,000&#x27; : &#x27;301+ headcount → ₱90,000&#x27;)
        : (users &lt;= 300 ? &#x27;1–300 headcount → ₱95,000&#x27; : &#x27;301+ headcount → ₱150,000&#x27;);
      const implNoteClass = isMigration ? &#x27;migration&#x27; : &#x27;standard&#x27;;
      const implIcon  = isMigration ? &#x27;🔄&#x27; : &#x27;ℹ️&#x27;;

      if (!isBundle) {
        // ── Single standard view ──
        let rows = `
          &lt;tr&gt;
            &lt;td class=&quot;item-name&quot;&gt;Performance Package &lt;span class=&quot;tag tag-required&quot;&gt;Required&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;${fmt(perfPUPM)} × ${users.toLocaleString()} users&lt;/td&gt;
            &lt;td&gt;${fmt(stdPerfMonthly)}/mo&lt;/td&gt;
            &lt;td&gt;${fmt(stdPerfAnnual)}/yr&lt;/td&gt;
          &lt;/tr&gt;
          ${addonRows()}
          &lt;tr&gt;
            &lt;td class=&quot;item-name&quot;&gt;Implementation Fee &lt;span class=&quot;tag tag-onetime&quot;&gt;One-time&lt;/span&gt;${migTag}&lt;/td&gt;
            &lt;td&gt;${tier}&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;${fmt(implFee)}&lt;/td&gt;
          &lt;/tr&gt;`;

        breakdownEl.innerHTML = buildBreakdownTable(
          rows,
          `${implIcon} &lt;strong&gt;${implLabel}:&lt;/strong&gt; ${implBracket} (${users.toLocaleString()} users)`,
          implNoteClass
        );

        summaryContent.innerHTML = `
          &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Performance Package&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(stdPerfAnnual)} / yr&lt;/span&gt;&lt;/div&gt;
          ${addonSummaryRows()}
          &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Annual Subscription Total&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(stdSubAnnual)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Implementation Fee &lt;span class=&quot;badge&quot;&gt;One-time&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(implFee)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;summary-total&quot;&gt;
            &lt;div class=&quot;total-row&quot;&gt;&lt;span class=&quot;total-label&quot;&gt;Total&lt;/span&gt;&lt;span class=&quot;total-value&quot;&gt;${fmt(stdGrandTotal)}&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`;

      } else {
        // ── Single bundled view ──
        const bundledRows = `
          &lt;tr&gt;
            &lt;td class=&quot;item-name&quot;&gt;Blended License Rate &lt;span class=&quot;tag tag-bundled&quot;&gt;Bundled&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;${fmt(bundledPUPM)} × ${users.toLocaleString()} users&lt;/td&gt;
            &lt;td&gt;${fmt(bundledPerfMonthly)}/mo&lt;/td&gt;
            &lt;td&gt;${fmt(bundledPerfAnnual)}/yr&lt;/td&gt;
          &lt;/tr&gt;
          ${addonRows()}`;

        breakdownEl.innerHTML = buildBreakdownTable(
          bundledRows,
          `🔀 &lt;strong&gt;Implementation fee absorbed into license rate.&lt;/strong&gt; Blended rate: ${fmt(bundledPUPM)}/user/mo`,
          &#x27;bundled&#x27;
        );

        summaryContent.innerHTML = `
          &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Blended License Rate&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(bundledPerfAnnual)} / yr&lt;/span&gt;&lt;/div&gt;
          ${addonSummaryRows()}
          &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Annual Subscription Total&lt;/span&gt;&lt;span class=&quot;value&quot;&gt;${fmt(bundledSubAnnual)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;summary-row&quot;&gt;&lt;span class=&quot;label&quot;&gt;Implementation Fee&lt;/span&gt;&lt;span class=&quot;value&quot; style=&quot;opacity:0.65;&quot;&gt;Absorbed ✓&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;summary-total&quot;&gt;
            &lt;div class=&quot;total-row&quot;&gt;&lt;span class=&quot;total-label&quot;&gt;Total&lt;/span&gt;&lt;span class=&quot;total-value&quot;&gt;${fmt(bundledGrandTotal)}&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`;
      }

      summaryEl.style.display = &#x27;block&#x27;;

      // Store for proposal generation
      pbProposalData = {
        users, isBundle, isMigration,
        stdPerfAnnual, addonsAnnual, stdSubAnnual, implFee, stdGrandTotal,
        bundledSubAnnual, bundledGrandTotal
      };
    }
  &lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>

  <div class="frame-wrap" id="wrap-roi">

  </div>

<script>
function showCalc(name) {
  document.querySelectorAll('.frame-wrap').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('wrap-' + name).classList.add('active');
  document.getElementById('btn-' + name).classList.add('active');
  resizeFrames();
}
function resizeFrame(frame) {
  try {
    const doc = frame.contentDocument || frame.contentWindow.document;
    if (!doc || !doc.body) return;
    const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, window.innerHeight - 58);
    frame.style.height = h + 'px';
  } catch(e) { frame.style.height = '1600px'; }
}
function resizeFrames() { document.querySelectorAll('iframe').forEach(resizeFrame); }
window.addEventListener('load', () => { resizeFrames(); setInterval(resizeFrames, 700); });
window.addEventListener('resize', resizeFrames);
</script>
</body>
</html>
